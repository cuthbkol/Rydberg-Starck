name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Tailwind and build CSS
        run: npm ci && npm run build
      - name: Prepare public site files
        run: |
          mkdir -p _site
          cp index.html output.css .nojekyll _site/
          cp -R pages assets _site/
          mkdir -p _site/src
          cp -R src/Partners _site/src/
          cp -R 'src/DIGMAP GALLERY' _site/src/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish with GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
